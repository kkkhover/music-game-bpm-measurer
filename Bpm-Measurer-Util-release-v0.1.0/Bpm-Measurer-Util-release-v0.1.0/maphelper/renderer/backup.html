<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:"
        />
        <title>自动备份</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="panel-body">
        <div class="panel-wrap">
            <div class="panel-titlebar">
                <span class="pt-title">自动备份</span>
                <button class="mini" id="btn-backup" title="立刻备份一次">立即备份</button>
                <button class="pin-btn" id="btn-pin" title="切换置顶（默认置顶）">📌</button>
            </div>
            <div class="bk-row">
                <span>下次</span><b id="bk-next">—</b>
                <span>已存</span><b id="bk-count">0</b>
                <span>占用</span><b id="bk-size">—</b>
            </div>
            <div class="bk-cfg">
                <label>间隔 <input type="number" id="cfg-interval" min="1" max="120" step="1" /> 分</label>
                <label>保留 <input type="number" id="cfg-keep" min="1" max="999" step="1" /> 份</label>
                <label class="toggle"><input type="checkbox" id="cfg-enabled" /> <span>启用</span></label>
            </div>
            <div class="bk-latest" id="bk-latest"></div>
            <div class="hint" id="bk-dir"></div>
            <label class="bk-dir-set">备份位置
                <input type="text" id="cfg-bkdir" placeholder="留空 = 默认目录" title="备份文件保存位置，可自行更改" />
            </label>
        </div>
        <script src="state.js"></script>
        <script src="backup-panel.js"></script>
    </body>
</html>
