<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:"
        />
        <!-- ★ v0.8.16：静态文案统一走 data-i18n。
             注意：「间隔 <input> 分」这类「文字夹输入框」的标签不能整块套 data-i18n
             （applyTo 会覆写 textContent，把里面的 <input> 一起冲掉）——
             所以把两段文字各包一层 <span> 分别标记。 -->
        <title data-i18n="autoBackup">自动备份</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="panel-body">
        <div class="panel-wrap">
            <div class="panel-titlebar">
                <span class="pt-title" data-i18n="autoBackup">自动备份</span>
                <button class="mini" id="btn-backup" data-i18n="backupNow" data-i18n-title="backupNowTip" title="立刻备份一次">立即备份</button>
                <button class="pin-btn" id="btn-pin" data-i18n-title="pinTip" title="切换置顶（默认置顶）">📌</button>
            </div>
            <div class="bk-row">
                <span data-i18n="nextAt">下次</span><b id="bk-next">—</b>
                <span data-i18n="stored">已存</span><b id="bk-count">0</b>
                <span data-i18n="usedSpace">占用</span><b id="bk-size">—</b>
            </div>
            <div class="bk-cfg">
                <label><span data-i18n="intervalLabel">间隔</span> <input type="number" id="cfg-interval" min="1" max="120" step="1" /> <span data-i18n="unitMin">分</span></label>
                <label><span data-i18n="keepLabel">保留</span> <input type="number" id="cfg-keep" min="1" max="999" step="1" /> <span data-i18n="unitCopies">份</span></label>
                <label class="toggle"><input type="checkbox" id="cfg-enabled" /> <span data-i18n="enabled">启用</span></label>
            </div>
            <div class="bk-latest" id="bk-latest"></div>
            <div class="hint" id="bk-dir"></div>
            <label class="bk-dir-set"
                ><span data-i18n="backupLocation">备份位置</span>
                <input
                    type="text"
                    id="cfg-bkdir"
                    data-i18n-ph="backupDirPh"
                    placeholder="留空 = 默认目录"
                    data-i18n-title="backupDirTip"
                    title="备份文件保存位置，可自行更改"
                />
            </label>
        </div>
        <script src="i18n.js"></script>
        <script src="state.js"></script>
        <script src="backup-panel.js"></script>
    </body>
</html>
